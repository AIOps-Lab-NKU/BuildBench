name: Publish runtime images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag containing the reviewed runtime build contexts
        required: true
        default: v0.1.0-rc.3
        type: string

permissions:
  # Write access is required for the repository token to enumerate draft
  # release assets. The workflow never creates, updates, or deletes releases.
  contents: write
  packages: write

concurrency:
  group: publish-runtime-images-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Download reviewed build contexts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p runtime-release
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -r --arg tag "$RELEASE_TAG" '
                .[]
                | select(.tag_name == $tag)
                | .assets[]
                | select(.name | test("^buildbench-(validator|example-assets)-context-.*\\.tar\\.gz$"))
                | [.id, .name]
                | @tsv
              ' \
            > runtime-release/assets.tsv
          test "$(wc -l < runtime-release/assets.tsv)" -eq 2
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "runtime-release/$asset_name"
          done < runtime-release/assets.tsv
          mkdir -p runtime-release/validator runtime-release/example-assets
          tar -xzf runtime-release/buildbench-validator-context-*.tar.gz \
            -C runtime-release/validator
          tar -xzf runtime-release/buildbench-example-assets-context-*.tar.gz \
            -C runtime-release/example-assets

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish Validator runtime
        uses: docker/build-push-action@v6
        with:
          context: runtime-release/validator
          file: runtime-release/validator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aiops-lab-nku/buildbench-validator-runtime:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max

      - name: Publish Example Assets
        uses: docker/build-push-action@v6
        with:
          context: runtime-release/example-assets
          file: runtime-release/example-assets/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/aiops-lab-nku/buildbench-example-assets:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
